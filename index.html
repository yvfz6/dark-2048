<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #000;
  --gap: clamp(5px, 1.5vmin, 10px);
}
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
}

body {
  color: #f5f5f6;
  font-family: "Google Sans", Arial, sans-serif;
  padding:
    max(8px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
  display: flex;
  justify-content: center;
  align-items: center;
  overscroll-behavior: none;
}

.app {
  width: min(100%, 920px);
  height: 100%;
  max-height: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  justify-content: center;
  gap: clamp(20px, 5vw, 65px);
}

h1 {
  margin: 0;
  font-size: clamp(42px, 7vw, 70px);
  line-height: .94;
  letter-spacing: -.065em;
  font-weight: 700;
  white-space: nowrap;
}
h1 span { display: block; }

.game {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.info {
  width: min(100%, var(--board-size));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: #96969c;
  font-size: clamp(10px, 1.7vmin, 13px);
  margin: 0 0 clamp(6px, 1.2vmin, 12px);
}
.scores {
  display: flex;
  gap: clamp(9px, 2vw, 20px);
  white-space: nowrap;
}
.score strong, .best strong { color: #f5f5f6; }

.board {
  position: relative;
  width: var(--board-size);
  height: var(--board-size);
  flex: 0 0 auto;
  padding: clamp(7px, 2.5%, 12px);
  border-radius: clamp(12px, 2.8vmin, 19px);
  background: linear-gradient(145deg, #202023, #111113);
  border: 1px solid rgba(220,220,230,.2);
  box-shadow:
    0 18px 60px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.07);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.cells, .tiles {
  position: absolute;
  inset: clamp(7px, 2.5%, 12px);
}
.cells {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  grid-template-rows: repeat(4, minmax(0,1fr));
  gap: var(--gap);
}
.cell {
  min-width: 0;
  min-height: 0;
  background: linear-gradient(145deg, #29292c, #222225);
  border: 1px solid rgba(220,220,230,.3);
  border-radius: clamp(5px, 1.5vmin, 10px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.035);
}
.tiles { pointer-events: none; }

.tile {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(5px, 1.5vmin, 10px);
  will-change: transform, opacity;
  transition:
    transform 230ms cubic-bezier(.35,.05,.25,1),
    opacity 170ms ease;
  font-weight: 700;
  letter-spacing: -1.5px;
  color: #f7f7f8;
  text-shadow: 0 1px 8px rgba(255,255,255,.12);
}
.tile .face {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: var(--tile-bg);
  border: 1px solid var(--tile-border);
  box-shadow:
    0 0 var(--glow) var(--glow-color),
    inset 0 1px 0 rgba(255,255,255,.12);
}
.tile.spawn .face { animation: spawn .19s ease-out both; }
.tile.merged .face { animation: merge .22s ease-out both; }

@keyframes spawn {
  from { transform: scale(.35); opacity: .2; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes merge {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.5); }
  100% { filter: brightness(1); }
}

.restart {
  margin-top: clamp(8px, 1.8vmin, 17px);
  padding: clamp(7px, 1.5vmin, 11px) clamp(22px, 4vw, 32px);
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(#080808,#080808) padding-box,
    linear-gradient(120deg,#777,#dedee2,#666) border-box;
  color: #eee;
  font: 600 clamp(12px, 1.8vmin, 15px) "Google Sans", sans-serif;
  cursor: pointer;
}
.restart:active { transform: scale(.97); }

/* Victory and game-over overlays */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.overlay.show { display: flex; }

.dialog {
  width: min(390px, 100%);
  padding: clamp(24px, 5vw, 38px);
  text-align: center;
  border-radius: 20px;
  border: 1px solid rgba(230,230,240,.2);
  background: linear-gradient(145deg, #202023, #101012);
  box-shadow: 0 20px 80px rgba(0,0,0,.7);
}
.dialog h2 {
  margin: 0 0 10px;
  font-size: clamp(32px, 7vw, 46px);
  letter-spacing: -2px;
}
.dialog p {
  color: #aaaab1;
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 24px;
}
.dialog-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}
.dialog button {
  min-width: 115px;
  padding: 11px 17px;
  border-radius: 9px;
  border: 1px solid #777780;
  background: #111;
  color: white;
  font: 600 14px "Google Sans", sans-serif;
  cursor: pointer;
}
.dialog button.primary {
  background: #eeeef1;
  color: #111;
  border-color: #eeeef1;
}
.dialog button:active { transform: scale(.97); }

/* Portrait phones and portrait tablets */
@media (max-width: 700px) {
  .app {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: clamp(7px, 1.7dvh, 15px);
  }
  h1 {
    font-size: clamp(25px, 6.5vw, 40px);
    line-height: 1;
    letter-spacing: -.055em;
    text-align: center;
  }
  h1 span { display: inline; }
  h1 span + span::before { content: " "; }
  .game { width: 100%; flex: 0 1 auto; }
  .board {
    width: var(--board-size);
    height: var(--board-size);
  }
}

/* Landscape phones and tablets */
@media (max-height: 520px) and (orientation: landscape) {
  .app {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
    gap: 18px;
  }
  h1 {
    font-size: clamp(25px, 7vh, 43px);
  }
  .game { width: auto; }
  .restart { margin-top: 5px; padding: 6px 18px; }
  .info { margin-bottom: 5px; }
}

/* Keep every element inside especially short screens */
@media (max-height: 430px) and (orientation: portrait) {
  .app { gap: 3px; }
  h1 { font-size: 23px; }
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition-duration: 1ms; }
  .tile .face { animation-duration: 1ms !important; }
}
</style>
</head>

<body>
<main class="app">
  <h1><span>Dark</span><span>2048</span></h1>

  <section class="game">
    <div class="info">
      <span>Join the tiles. Reach 2048.</span>
      <div class="scores">
        <span class="score">Score: <strong id="score">0</strong></span>
        <span class="best">Best: <strong id="best">0</strong></span>
      </div>
    </div>

    <div class="board" id="board" aria-label="2048 game board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <button class="restart" id="restart">Restart</button>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h2 id="overlayTitle">You win!</h2>
    <p id="overlayMessage">You reached 2048!</p>
    <div class="dialog-buttons" id="overlayButtons"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const MOVE_TIME = 235;
  const board = document.getElementById("board");
  const cellsEl = document.getElementById("cells");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayMessage = document.getElementById("overlayMessage");
  const overlayButtons = document.getElementById("overlayButtons");

  let grid;
  let score = 0;
  let best = 0;
  let tileId = 0;
  let busy = false;
  let gameEnded = false;
  let showed2048 = false;
  let pointerStart = null;
  let resizeObserver = null;

  try {
    best = Number(localStorage.getItem("dark2048-best") || 0);
  } catch (_) {}
  bestEl.textContent = best;

  // Build the permanent background cells.
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  function tileStyle(value) {
    // Low-value tiles.
    if (value < 64) {
      const palette = {
        2: ["#414145", "#74747b", 7, "rgba(220,220,255,.08)", "#fff"],
        4: ["#4d4d52", "#85858d", 9, "rgba(220,220,255,.09)", "#fff"],
        8: ["#59595f", "#9999a2", 11, "rgba(220,220,255,.10)", "#fff"],
        16: ["#65656c", "#aaaab3", 13, "rgba(220,220,255,.11)", "#fff"],
        32: ["#74747c", "#bcbcc5", 15, "rgba(220,220,255,.12)", "#fff"]
      };
      return palette[value] || palette[2];
    }

    // 64 becomes light grey with dark text.
    if (value === 64) {
      return ["#c9c9ce", "#ededf1", 18, "rgba(230,230,245,.17)", "#111"];
    }

    // Glow gradually strengthens from 128 through 512.
    if (value === 128) {
      return ["#d2d2d7", "#f3f3f6", 23, "rgba(235,235,255,.24)", "#111"];
    }
    if (value === 256) {
      return ["#d9d9de", "#fff", 29, "rgba(240,240,255,.31)", "#111"];
    }
    if (value === 512) {
      return ["#e3e3e7", "#fff", 36, "rgba(245,245,255,.40)", "#111"];
    }

    // 1024 onwards: black tile, white text, increasingly powerful glow.
    const level = Math.max(0, Math.log2(value) - 10);
    const glow = Math.min(75, 42 + level * 6);
    const alpha = Math.min(.8, .42 + level * .055);
    return [
      "#08080a",
      `rgba(255,255,255,${Math.min(.95,.5 + level*.07)})`,
      glow,
      `rgba(235,225,255,${alpha})`,
      "#fff"
    ];
  }

  function positionFor(row, col) {
    const cell = cellsEl.children[row * SIZE + col];
    const parent = tilesEl.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();

    return {
      x: rect.left - parent.left,
      y: rect.top - parent.top,
      width: rect.width,
      height: rect.height
    };
  }

  function numberFontSize(value, width) {
    const digits = String(value).length;
    const ratio =
      digits <= 1 ? .55 :
      digits === 2 ? .48 :
      digits === 3 ? .39 :
      digits === 4 ? .32 :
      digits === 5 ? .26 : .21;

    return Math.max(11, Math.min(49, width * ratio));
  }

  function applyTile(el, value, row, col) {
    const p = positionFor(row, col);
    const [bg, border, glow, glowColor, textColor] = tileStyle(value);

    el.style.width = p.width + "px";
    el.style.height = p.height + "px";
    el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
    el.style.fontSize = numberFontSize(value, p.width) + "px";
    el.style.color = textColor;
    el.style.textShadow = textColor === "#111" ? "none" : "0 1px 8px rgba(255,255,255,.12)";
    el.style.setProperty("--tile-bg", bg);
    el.style.setProperty("--tile-border", border);
    el.style.setProperty("--glow", glow + "px");
    el.style.setProperty("--glow-color", glowColor);
    el.firstElementChild.textContent = value;
    el.dataset.value = value;
  }

  function createTile(item, row, col, isNew = false) {
    const el = document.createElement("div");
    el.className = "tile";
    el.dataset.id = item.id;

    const face = document.createElement("div");
    face.className = "face";
    el.appendChild(face);

    // Set the real cell position BEFORE inserting into the page.
    // This prevents the tile from ever appearing at the top-left.
    const p = positionFor(row, col);
    el.style.transition = "none";
    el.style.width = p.width + "px";
    el.style.height = p.height + "px";
    el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;

    tilesEl.appendChild(el);
    applyTile(el, item.value, row, col);

    // Restore movement transitions only after its correct position is set.
    requestAnimationFrame(() => {
      if (!el.isConnected) return;
      el.style.transition = "";
      if (isNew) {
        el.classList.add("spawn");
        setTimeout(() => el.classList.remove("spawn"), 220);
      }
    });

    return el;
  }

  function getTile(id) {
    return tilesEl.querySelector(`.tile[data-id="${id}"]`);
  }

  function render(keepIds = new Set()) {
    const active = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;

        active.add(item.id);
        let el = getTile(item.id);

        if (!el) {
          el = createTile(item, r, c);
        } else {
          applyTile(el, item.value, r, c);
        }
      }
    }

    tilesEl.querySelectorAll(".tile").forEach(el => {
      const id = Number(el.dataset.id);
      if (!active.has(id) && !keepIds.has(id)) el.remove();
    });
  }

  function spawnTile() {
    const empty = [];

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r,c]);
      }
    }

    if (!empty.length) return;

    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < .9 ? 2 : 4;
    const item = {id: ++tileId, value};

    grid[r][c] = item;
    createTile(item, r, c, true);
  }

  function updateScore() {
    scoreEl.textContent = score;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem("dark2048-best", String(best));
      } catch (_) {}
    }
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function addOverlayButton(label, callback, primary = false) {
    const button = document.createElement("button");
    button.textContent = label;
    if (primary) button.className = "primary";
    button.addEventListener("click", callback);
    overlayButtons.appendChild(button);
  }

  function show2048Win() {
    overlayTitle.textContent = "You win!";
    overlayMessage.textContent =
      "You reached 2048! Keep going to discover how far you can get.";
    overlayButtons.replaceChildren();

    addOverlayButton("Play Again", startGame);
    addOverlayButton("Continue", () => {
      hideOverlay();
      busy = false;
    }, true);

    overlay.classList.add("show");
  }

  function showFinalWin() {
    gameEnded = true;
    overlayTitle.textContent = "LEGENDARY!";
    overlayMessage.textContent =
      "You reached 65536. You have completed the whole game!";
    overlayButtons.replaceChildren();
    addOverlayButton("Play Again", startGame, true);
    overlay.classList.add("show");
  }

  function showGameOver() {
    gameEnded = true;
    overlayTitle.textContent = "Game over";
    overlayMessage.textContent = `No more moves. Your score: ${score}`;
    overlayButtons.replaceChildren();
    addOverlayButton("Play Again", startGame, true);
    overlay.classList.add("show");
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    tileId = 0;
    busy = false;
    gameEnded = false;
    showed2048 = false;
    hideOverlay();
    tilesEl.replaceChildren();
    updateScore();
    spawnTile();
    spawnTile();
    render();
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;

        if (r < 3 && grid[r][c].value === grid[r+1][c]?.value) return true;
        if (c < 3 && grid[r][c].value === grid[r][c+1]?.value) return true;
      }
    }
    return false;
  }

  function checkMilestones() {
    let highest = 0;
    for (const row of grid) {
      for (const item of row) {
        if (item) highest = Math.max(highest, item.value);
      }
    }

    if (highest >= 65536) {
      showFinalWin();
      return;
    }

    if (highest >= 2048 && !showed2048) {
      showed2048 = true;
      show2048Win();
      return;
    }

    if (!hasMoves()) showGameOver();
  }

  function move(direction) {
    if (busy || gameEnded || overlay.classList.contains("show")) return;

    const next = emptyGrid();
    const mergePairs = [];
    let gained = 0;
    let changed = false;

    for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
      const coords = [];

      for (let k = 0; k < SIZE; k++) {
        let r, c;

        if (direction === "left") { r = lineIndex; c = k; }
        if (direction === "right") { r = lineIndex; c = SIZE - 1 - k; }
        if (direction === "up") { r = k; c = lineIndex; }
        if (direction === "down") { r = SIZE - 1 - k; c = lineIndex; }

        coords.push([r,c]);
      }

      const items = coords
        .map(([r,c]) => grid[r][c])
        .filter(Boolean);

      const compact = [];

      for (let i = 0; i < items.length; i++) {
        const current = items[i];
        const following = items[i+1];

        if (following && current.value === following.value) {
          const merged = {
            id: current.id,
            value: current.value * 2
          };

          compact.push(merged);
          mergePairs.push({
            winner: current.id,
            loser: following.id
          });
          gained += merged.value;
          i++;
        } else {
          compact.push(current);
        }
      }

      compact.forEach((item, index) => {
        const [r,c] = coords[index];
        next[r][c] = item;
      });

      // Compare original and destination positions.
      for (let k = 0; k < SIZE; k++) {
        const [r,c] = coords[k];
        const oldItem = grid[r][c];
        const newItem = next[r][c];

        if ((oldItem?.id || 0) !== (newItem?.id || 0)) changed = true;
      }
    }

    if (!changed) return;

    busy = true;

    const loserIds = new Set(mergePairs.map(pair => pair.loser));

    // Move merge losers toward their matching winner.
    for (const pair of mergePairs) {
      const loserEl = getTile(pair.loser);
      const winnerPosition = findItem(next, pair.winner);

      if (!loserEl || !winnerPosition) continue;

      const p = positionFor(winnerPosition.row, winnerPosition.col);
      loserEl.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
      loserEl.style.opacity = "0";
    }

    grid = next;
    render(loserIds);

    // Animate the merged tile's brightness without a bounce.
    for (const pair of mergePairs) {
      const winnerEl = getTile(pair.winner);
      const item = findItem(grid, pair.winner)?.item;
      if (!winnerEl || !item) continue;

      winnerEl.classList.remove("merged");
      void winnerEl.offsetWidth;
      winnerEl.classList.add("merged");
    }

    score += gained;
    updateScore();

    setTimeout(() => {
      loserIds.forEach(id => {
        const el = getTile(id);
        if (el) el.remove();
      });

      spawnTile();
      render();
      busy = false;
      checkMilestones();
    }, MOVE_TIME + 15);
  }

  function findItem(boardGrid, id) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = boardGrid[r][c];
        if (item && item.id === id) return {item, row:r, col:c};
      }
    }
    return null;
  }

  // Keyboard and WASD.
  document.addEventListener("keydown", event => {
    const keyMap = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };

    const direction = keyMap[event.key];
    if (!direction) return;

    event.preventDefault();
    move(direction);
  }, {passive:false});

  // Reliable pointer swipe handling for touch, mouse, and stylus.
  board.addEventListener("contextmenu", e => e.preventDefault());

  board.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;

    pointerStart = {
      x: event.clientX,
      y: event.clientY,
      id: event.pointerId
    };

    try { board.setPointerCapture(event.pointerId); } catch (_) {}
    event.preventDefault();
  }, {passive:false});

  function finishSwipe(event) {
    if (!pointerStart || pointerStart.id !== event.pointerId) return;

    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    pointerStart = null;

    const distance = Math.hypot(dx, dy);

    // Low threshold catches short and quick swipes.
    if (distance < 7) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }

    event.preventDefault();
  }

  board.addEventListener("pointerup", finishSwipe, {passive:false});
  board.addEventListener("pointercancel", () => {
    pointerStart = null;
  });

  // Reposition tiles on resize without animating them from the corner.
  function repositionAll() {
    if (!grid || busy) return;

    tilesEl.querySelectorAll(".tile").forEach(el => {
      el.style.transition = "none";
    });

    render();

    requestAnimationFrame(() => {
      tilesEl.querySelectorAll(".tile").forEach(el => {
        el.style.transition = "";
      });
    });
  }

  if ("ResizeObserver" in window) {
    resizeObserver = new ResizeObserver(repositionAll);
    resizeObserver.observe(board);
  } else {
    window.addEventListener("resize", repositionAll);
  }

  document.getElementById("restart").addEventListener("click", startGame);

  // Responsive board sizing: use both available width AND height.
  function fitBoard() {
    const mobile = window.matchMedia("(max-width: 700px)").matches;
    const shortLandscape = window.matchMedia(
      "(max-height: 520px) and (orientation: landscape)"
    ).matches;

    const availableWidth = document.documentElement.clientWidth;
    const availableHeight = window.innerHeight;

    let size;

    if (mobile && !shortLandscape) {
      // Reserve room for title, score, and restart button.
      size = Math.min(
        availableWidth - 20,
        availableHeight - 132,
        460
      );
    } else if (shortLandscape) {
      size = Math.min(
        availableWidth * .58,
        availableHeight - 35,
        390
      );
    } else {
      size = Math.min(
        460,
        availableWidth * .62,
        availableHeight * .78
      );
    }

    size = Math.max(120, size);
    document.documentElement.style.setProperty("--board-size", size + "px");
  }

  fitBoard();
  window.addEventListener("resize", () => {
    fitBoard();
    repositionAll();
  });
  window.addEventListener("orientationchange", () => {
    setTimeout(() => {
      fitBoard();
      repositionAll();
    }, 100);
  });

  startGame();
})();
</script>
