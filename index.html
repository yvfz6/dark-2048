<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gap: clamp(5px, 1.5vmin, 10px);
  --board-bg: #171719;
}
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #000;
}
body {
  color: #f5f5f6;
  font-family: "Google Sans", Arial, sans-serif;
  display: grid;
  place-items: center;
  padding:
    max(7px, env(safe-area-inset-top))
    max(9px, env(safe-area-inset-right))
    max(7px, env(safe-area-inset-bottom))
    max(9px, env(safe-area-inset-left));
  overscroll-behavior: none;
}

.layout {
  width: min(100%, 920px);
  height: 100%;
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 5vw, 65px);
}

h1 {
  margin: 0;
  font-size: clamp(38px, 7vw, 70px);
  line-height: .94;
  letter-spacing: -.065em;
  font-weight: 700;
  flex: 0 0 auto;
}
h1 span { display: block; }

.game {
  width: min( min(64vw, 70vh), 460px);
  flex: 0 1 auto;
  min-width: 0;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: #929297;
  font-size: clamp(10px, 1.7vmin, 13px);
  margin: 0 2px clamp(6px, 1.4vmin, 11px);
}
.scoreline {
  display: flex;
  gap: 12px;
  white-space: nowrap;
}
.scoreline b { color: #eee; font-weight: 600; }

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: 10px;
  border-radius: clamp(12px, 2.8vmin, 18px);
  background: linear-gradient(145deg, #202023, #111113);
  border: 1px solid rgba(255,255,255,.17);
  box-shadow: 0 18px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.cells, .tiles {
  position: absolute;
  inset: 10px;
}
.cells {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
}
.cell {
  min-width: 0;
  min-height: 0;
  background: linear-gradient(145deg, #29292c, #222225);
  border: 1px solid rgba(220,220,230,.32);
  border-radius: clamp(5px, 1.5vmin, 10px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.035);
}
.tiles { pointer-events: none; }

.tile {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(5px, 1.5vmin, 10px);
  will-change: transform;
  transition:
    transform 235ms cubic-bezier(.35,.05,.25,1),
    opacity 180ms ease;
  font-weight: 700;
  letter-spacing: -1.5px;
  color: #f7f7f8;
  text-shadow: 0 1px 8px rgba(255,255,255,.12);
}
.tile .face {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: var(--tile-bg, #555);
  border: 1px solid var(--tile-border, rgba(255,255,255,.2));
  box-shadow:
    0 0 var(--glow, 8px) var(--glow-color, rgba(255,255,255,.08)),
    inset 0 1px 0 rgba(255,255,255,.12);
}
.tile.light-text { color: #111114; text-shadow: none; }
.tile.spawn .face { animation: spawn .2s ease-out both; }
.tile.merged .face { animation: merge .22s ease-out both; }

@keyframes spawn {
  from { transform: scale(.35); opacity: .15; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes merge {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.45); }
  100% { filter: brightness(1); }
}

.controls {
  display: flex;
  justify-content: center;
  margin-top: clamp(8px, 1.8vmin, 17px);
}
.restart {
  padding: clamp(7px, 1.5vmin, 11px) clamp(22px, 4vw, 32px);
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(#080808,#080808) padding-box,
    linear-gradient(120deg,#777,#dedee2,#666) border-box;
  color: #eee;
  font: 600 clamp(12px, 1.8vmin, 15px) "Google Sans", sans-serif;
  cursor: pointer;
}
.restart:hover {
  background:
    linear-gradient(#191919,#191919) padding-box,
    linear-gradient(120deg,#aaa,#fff,#888) border-box;
}
.restart:active { transform: scale(.97); }

/* Victory overlay */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
}
.overlay.show {
  opacity: 1;
  visibility: visible;
}
.modal {
  width: min(360px, 100%);
  padding: 32px 24px;
  text-align: center;
  background: linear-gradient(145deg,#242427,#111113);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px;
  box-shadow: 0 20px 80px rgba(0,0,0,.6);
  transform: translateY(12px) scale(.97);
  transition: transform .25s ease;
}
.overlay.show .modal { transform: translateY(0) scale(1); }
.modal h2 {
  margin: 0 0 8px;
  font-size: clamp(34px, 8vw, 46px);
  letter-spacing: -2px;
}
.modal p { color: #aaaab0; margin: 0 0 22px; }
.modal-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-buttons button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.25);
  background: #303034;
  color: white;
  font: 600 14px "Google Sans", sans-serif;
  cursor: pointer;
}
.modal-buttons button.primary {
  color: #111;
  background: #eeeef1;
  border-color: #eeeef1;
}
.modal-buttons button:active { transform: scale(.98); }

/* Portrait phones and tablets */
@media (max-width: 700px) {
  .layout {
    flex-direction: column;
    gap: clamp(5px, 1.4dvh, 13px);
    justify-content: center;
  }
  h1 {
    font-size: clamp(24px, min(7vw, 5.5dvh), 42px);
    line-height: 1;
    letter-spacing: -.05em;
    text-align: center;
  }
  h1 span { display: inline; }
  h1 span + span::before { content: " "; }
  .game {
    width: min(90vw, 72dvh, 460px);
    flex: 0 1 auto;
  }
}

/* Short landscape screens */
@media (max-height: 520px) {
  .layout { gap: 16px; }
  h1 { font-size: clamp(24px, 6dvh, 38px); }
  .game { width: min( min(65vw, 83dvh), 390px); }
  .info { margin-bottom: 5px; }
  .controls { margin-top: 6px; }
  .restart { padding: 6px 20px; }
}
@media (max-width: 700px) and (max-height: 520px) {
  .layout { flex-direction: row; gap: 12px; }
  h1 {
    font-size: clamp(22px, 5dvh, 34px);
    text-align: left;
  }
  h1 span { display: block; }
  h1 span + span::before { content: none; }
  .game { width: min( min(70vw, 85dvh), 390px); }
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition-duration: 1ms; }
  .tile .face { animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<main class="layout">
  <h1><span>Dark</span><span>2048</span></h1>

  <section class="game">
    <div class="info">
      <span>Join the tiles. Reach 2048.</span>
      <span class="scoreline">
        <span>Score: <b id="score">0</b></span>
        <span>Best: <b id="best">0</b></span>
      </span>
    </div>

    <div class="board" id="board" aria-label="2048 game board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="controls">
      <button class="restart" id="restart">Restart</button>
    </div>
  </section>
</main>

<div class="overlay" id="winOverlay">
  <div class="modal">
    <h2>You win!</h2>
    <p>You reached 2048. What would you like to do?</p>
    <div class="modal-buttons">
      <button class="primary" id="playAgain">Play Again</button>
      <button id="continueGame">Continue playing</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const board = document.getElementById("board");
  const cellsEl = document.getElementById("cells");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("winOverlay");

  let grid;
  let score = 0;
  let best = loadBest();
  let tileId = 0;
  let busy = false;
  let won = false;
  let inputQueue = [];
  let tileElements = new Map();
  let gameOverShown = false;

  bestEl.textContent = best;

  function loadBest() {
    try { return Number(localStorage.getItem("dark2048-best")) || 0; }
    catch (_) { return 0; }
  }

  function saveBest() {
    try { localStorage.setItem("dark2048-best", String(best)); }
    catch (_) {}
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
  }

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  function colorFor(value) {
    const colors = {
      2:    ["#454548","#77777d",8,false],
      4:    ["#55555a","#85858c",10,false],
      8:    ["#68686e","#a0a0a8",13,false],
      16:   ["#77777f","#b1b1ba",16,false],
      32:   ["#898992","#c4c4cd",20,false],
      64:   ["#9b9ba5","#d0d0d9",24,false],
      128:  ["#c0c0c8","#e2e2e8",29,true],
      256:  ["#ceced5","#e9e9ef",34,true],
      512:  ["#d8d8df","#f0f0f4",39,true],
      1024: ["#e3e3e9","#f7f7fa",45,true],
      2048: ["#eeeeF2","#fff",52,true]
    };
    return colors[value] || ["#eeeeF2","#fff",58,true];
  }

  // Measure the actual cell, not an assumed grid position.
  function getPosition(row, col) {
    const cell = cellsEl.children[row * SIZE + col];
    const parent = tilesEl.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();

    return {
      x: rect.left - parent.left,
      y: rect.top - parent.top,
      width: rect.width,
      height: rect.height
    };
  }

  function fontSize(value, width) {
    const digits = String(value).length;
    const ratio = digits === 1 ? .55 :
                  digits === 2 ? .49 :
                  digits === 3 ? .40 :
                  digits === 4 ? .32 : .25;
    return Math.max(12, Math.min(48, width * ratio));
  }

  function styleTile(el, value, row, col) {
    const pos = getPosition(row, col);
    const [bg, border, glow, lightText] = colorFor(value);

    el.style.width = pos.width + "px";
    el.style.height = pos.height + "px";
    el.style.transform = `translate3d(${pos.x}px,${pos.y}px,0)`;
    el.style.fontSize = fontSize(value, pos.width) + "px";
    el.style.setProperty("--tile-bg", bg);
    el.style.setProperty("--tile-border", border);
    el.style.setProperty("--glow", glow + "px");
    el.style.setProperty(
      "--glow-color",
      `rgba(235,235,255,${Math.min(.32, .09 + glow / 220)})`
    );

    el.classList.toggle("light-text", lightText);
    el.firstChild.textContent = value;
  }

  function createTile(item, row, col, animate = false) {
    const el = document.createElement("div");
    el.className = "tile" + (animate ? " spawn" : "");
    el.dataset.id = item.id;

    const face = document.createElement("div");
    face.className = "face";
    el.appendChild(face);

    // Put the tile in its correct cell before it becomes visible.
    // No default top-left flash.
    el.style.transition = "none";
    tilesEl.appendChild(el);
    tileElements.set(item.id, el);
    styleTile(el, item.value, row, col);

    if (animate) {
      el.getBoundingClientRect();
      requestAnimationFrame(() => {
        el.style.transition = "";
      });
    }
    return el;
  }

  function render(preserve = new Set()) {
    const present = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;

        present.add(item.id);
        let el = tileElements.get(item.id);

        if (!el) {
          createTile(item, r, c);
        } else {
          styleTile(el, item.value, r, c);
        }
      }
    }

    for (const [id, el] of tileElements) {
      if (!present.has(id) && !preserve.has(id)) {
        el.remove();
        tileElements.delete(id);
      }
    }
  }

  function spawnTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r,c]);
      }
    }
    if (!empty.length) return;

    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    const item = {
      id: ++tileId,
      value: Math.random() < .9 ? 2 : 4
    };

    grid[r][c] = item;
    createTile(item, r, c, true);
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    tileId = 0;
    busy = false;
    won = false;
    gameOverShown = false;
    inputQueue = [];

    for (const el of tileElements.values()) el.remove();
    tileElements.clear();

    overlay.classList.remove("show");
    updateScore();

    // Wait until layout is measured, then create tiles in their real cells.
    requestAnimationFrame(() => {
      spawnTile();
      spawnTile();
    });
  }

  function hasWon() {
    return grid.some(row => row.some(item => item && item.value >= 2048));
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) return true;
        if (r < 3 && grid[r+1][c]?.value === item.value) return true;
        if (c < 3 && grid[r][c+1]?.value === item.value) return true;
      }
    }
    return false;
  }

  function showGameOver() {
    if (gameOverShown) return;
    gameOverShown = true;
    setTimeout(() => {
      if (!canMove()) {
        const modal = overlay.querySelector(".modal");
        modal.querySelector("h2").textContent = "Game over";
        modal.querySelector("p").textContent = "Final score: " + score;
        document.getElementById("continueGame").style.display = "none";
        document.getElementById("playAgain").textContent = "Play Again";
        overlay.classList.add("show");
      }
    }, 80);
  }

  function requestMove(direction) {
    if (overlay.classList.contains("show")) return;

    if (busy) {
      // Keep a short queue so fast swipes/keypresses are not discarded.
      if (inputQueue.length < 3) inputQueue.push(direction);
      return;
    }
    move(direction);
  }

  function move(direction) {
    if (busy || overlay.classList.contains("show")) return;

    const next = emptyGrid();
    let changed = false;
    let gained = 0;
    const merges = [];

    for (let i = 0; i < SIZE; i++) {
      const coords = [];

      for (let j = 0; j < SIZE; j++) {
        let r, c;
        if (direction === "up") { r = j; c = i; }
        else if (direction === "down") { r = 3-j; c = i; }
        else if (direction === "left") { r = i; c = j; }
        else { r = i; c = 3-j; }
        coords.push([r,c]);
      }

      const line = coords
        .map(([r,c]) => grid[r][c])
        .filter(Boolean);

      const compact = [];
      for (let j = 0; j < line.length; j++) {
        const current = line[j];
        const following = line[j+1];

        if (following && current.value === following.value) {
          const merged = {
            id: current.id,
            value: current.value * 2
          };
          compact.push(merged);
          merges.push({
            winner: current.id,
            loser: following.id,
            value: merged.value
          });
          gained += merged.value;
          j++;
        } else {
          compact.push(current);
        }
      }

      for (let j = 0; j < compact.length; j++) {
        const [r,c] = coords[j];
        next[r][c] = compact[j];
      }

      for (let j = 0; j < SIZE; j++) {
        const [r,c] = coords[j];
        if (grid[r][c]?.id !== next[r][c]?.id) changed = true;
      }
    }

    if (!changed) return;

    busy = true;

    const loserIds = new Set(merges.map(m => m.loser));
    const oldRects = new Map();

    // Capture the old locations before changing the grid.
    for (const [id, el] of tileElements) {
      oldRects.set(id, el.getBoundingClientRect());
    }

    // Keep merged-away tiles temporarily so they can glide into their partner.
    grid = next;
    render(loserIds);

    for (const merge of merges) {
      const winner = tileElements.get(merge.winner);
      const loser = tileElements.get(merge.loser);

      const row = next.findIndex(line => line.some(x => x && x.id === merge.winner));
      const col = next[row].findIndex(x => x && x.id === merge.winner);

      if (winner) {
        const item = next[row][col];
        styleTile(winner, item.value, row, col);
        winner.classList.remove("merged");
        void winner.offsetWidth;
        winner.classList.add("merged");
      }

      if (loser) {
        const pos = getPosition(row, col);
        loser.style.transform = `translate3d(${pos.x}px,${pos.y}px,0)`;
        loser.style.opacity = "0";
      }
    }

    score += gained;
    updateScore();

    const duration = 250;

    setTimeout(() => {
      for (const id of loserIds) {
        const el = tileElements.get(id);
        if (el) el.remove();
        tileElements.delete(id);
      }

      render();
      spawnTile();

      busy = false;

      if (!won && hasWon()) {
        won = true;
        inputQueue = [];
        document.getElementById("continueGame").style.display = "";
        document.querySelector("#winOverlay h2").textContent = "You win!";
        document.querySelector("#winOverlay p").textContent =
          "You reached 2048! Keep going or start a new game.";
        document.getElementById("playAgain").textContent = "Play Again";
        overlay.classList.add("show");
        return;
      }

      if (!canMove()) {
        inputQueue = [];
        showGameOver();
        return;
      }

      if (inputQueue.length) {
        const nextDirection = inputQueue.shift();
        requestAnimationFrame(() => move(nextDirection));
      }
    }, duration);
  }

  // Keyboard controls.
  document.addEventListener("keydown", e => {
    const keys = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };

    const direction = keys[e.key];
    if (!direction) return;

    e.preventDefault();
    if (e.repeat) return;
    requestMove(direction);
  }, {passive: false});

  // Pointer swipe handling: supports touch, pen, and mouse.
  let pointerStart = null;
  let pointerLast = null;
  let pointerId = null;

  board.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;

    pointerId = e.pointerId;
    pointerStart = {x: e.clientX, y: e.clientY};
    pointerLast = pointerStart;

    try { board.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  }, {passive: false});

  board.addEventListener("pointermove", e => {
    if (pointerId !== e.pointerId || !pointerStart) return;
    pointerLast = {x: e.clientX, y: e.clientY};
    e.preventDefault();
  }, {passive: false});

  function finishSwipe(e) {
    if (pointerId !== null && e.pointerId !== pointerId) return;
    if (!pointerStart) return;

    const end = pointerLast || {x: e.clientX, y: e.clientY};
    const dx = end.x - pointerStart.x;
    const dy = end.y - pointerStart.y;

    pointerStart = null;
    pointerLast = null;
    pointerId = null;

    const distance = Math.hypot(dx, dy);
    if (distance < 8) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      requestMove(dx > 0 ? "right" : "left");
    } else {
      requestMove(dy > 0 ? "down" : "up");
    }
    e.preventDefault();
  }

  board.addEventListener("pointerup", finishSwipe, {passive: false});
  board.addEventListener("pointercancel", finishSwipe, {passive: false});
  board.addEventListener("lostpointercapture", () => {
    pointerStart = null;
    pointerLast = null;
    pointerId = null;
  });

  // Restart and victory choices.
  document.getElementById("restart").addEventListener("click", startGame);
  document.getElementById("playAgain").addEventListener("click", startGame);

  document.getElementById("continueGame").addEventListener("click", () => {
    overlay.classList.remove("show");
    won = true;
    busy = false;
    if (inputQueue.length) {
      const direction = inputQueue.shift();
      requestAnimationFrame(() => move(direction));
    }
  });

  // Recalculate every tile after rotation or resizing.
  let resizeFrame = 0;
  function resizeBoard() {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (!grid || busy) return;
      render();
    });
  }

  if ("ResizeObserver" in window) {
    new ResizeObserver(resizeBoard).observe(board);
  } else {
    window.addEventListener("resize", resizeBoard);
  }

  startGame();
})();
</script>
</body>
</html>
