<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --gap: clamp(5px, 1.7vmin, 10px);
}
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #000;
}
body {
  font-family: "Google Sans", Arial, sans-serif;
  color: #f5f5f5;
  display: grid;
  place-items: center;
  padding:
    max(8px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
}
button { font-family: inherit; }

.layout {
  width: min(100%, 1050px);
  height: 100%;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(20px, 5vw, 75px);
}

h1 {
  margin: 0;
  flex: 0 0 auto;
  font-size: clamp(38px, 7vw, 76px);
  line-height: .9;
  letter-spacing: -.065em;
  font-weight: 700;
}
h1 span { display: block; }

.game {
  width: min(460px, 58vh, 62vw);
  min-width: 0;
  flex: 0 1 auto;
}
.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 0 2px 10px;
  color: #99999f;
  font-size: clamp(10px, 1.6vmin, 13px);
}
.scores {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}
.score-value { color: #f4f4f4; font-weight: 700; }

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: 12px;
  border-radius: 18px;
  background: linear-gradient(145deg, #202023, #111113);
  border: 1px solid rgba(230,230,240,.19);
  box-shadow: 0 18px 60px #000b, inset 0 1px 0 #ffffff0d;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.cells, .tiles {
  position: absolute;
  inset: 12px;
}
.cells {
  display: grid;
  grid-template: repeat(4, 1fr) / repeat(4, 1fr);
  gap: var(--gap);
}
.cell {
  border-radius: 9px;
  background: linear-gradient(145deg, #29292d, #222225);
  border: 1px solid rgba(220,220,230,.3);
  box-shadow: inset 0 1px 2px #ffffff08;
}
.tiles { pointer-events: none; }

.tile {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  will-change: transform, opacity;
  transition:
    transform 175ms cubic-bezier(.22,.72,.2,1),
    opacity 150ms ease;
  font-weight: 700;
  letter-spacing: -1.5px;
  color: #f8f8fa;
}
.face {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  border: 1px solid var(--tile-border);
  background: var(--tile-bg);
  color: var(--text-color, #f8f8fa);
  box-shadow:
    0 0 var(--glow) var(--glow-color),
    inset 0 1px 0 #ffffff1c;
  transition: background 160ms ease, box-shadow 160ms ease;
}
.tile.spawn .face {
  animation: spawn .17s cubic-bezier(.2,.8,.2,1) both;
}
.tile.merge .face {
  animation: merge .18s ease-out;
}
@keyframes spawn {
  from { transform: scale(.25); opacity: .2; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes merge {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.6); }
  100% { filter: brightness(1); }
}

.actions {
  display: flex;
  justify-content: center;
  margin-top: 14px;
}
.restart {
  padding: 10px 30px;
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(#080808,#080808) padding-box,
    linear-gradient(120deg,#777,#dedee2,#666) border-box;
  color: #eee;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .15s, background .15s;
}
.restart:hover {
  background:
    linear-gradient(#191919,#191919) padding-box,
    linear-gradient(120deg,#aaa,#fff,#888) border-box;
}
.restart:active { transform: scale(.96); }

/* Victory overlays */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.overlay.show { display: flex; }
.dialog {
  width: min(390px, 92vw);
  padding: 32px 24px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px;
  background: linear-gradient(145deg,#202023,#101012);
  box-shadow: 0 20px 80px #000;
  animation: appear .25s ease-out both;
}
@keyframes appear {
  from { opacity: 0; transform: scale(.92) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.dialog h2 {
  margin: 0 0 10px;
  font-size: clamp(32px, 8vw, 46px);
  letter-spacing: -2px;
}
.dialog p {
  margin: 0 0 24px;
  color: #aaaab0;
  font-size: 14px;
  line-height: 1.5;
}
.dialog-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}
.dialog button {
  padding: 11px 18px;
  border-radius: 9px;
  border: 1px solid #777;
  background: #171719;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.dialog button.primary {
  background: #eee;
  color: #111;
  border-color: #eee;
}
.dialog button:active { transform: scale(.97); }

/* Portrait phones and tablets */
@media (max-width: 760px) {
  .layout {
    flex-direction: column;
    gap: clamp(5px, 1.5dvh, 13px);
    justify-content: center;
  }
  h1 {
    font-size: clamp(27px, 5.2dvh, 42px);
    line-height: .9;
    letter-spacing: -.055em;
    text-align: center;
  }
  h1 span { display: inline; }
  h1 span + span::before { content: " "; }
  .game {
    width: min(92vw, 460px, calc(100dvh - 125px));
    flex: 0 1 auto;
  }
  .board { padding: clamp(7px, 2.5%, 12px); }
  .cells, .tiles { inset: clamp(7px, 2.5%, 12px); }
  .info { margin-bottom: 7px; }
  .actions { margin-top: 8px; }
  .restart { padding: 8px 24px; }
}

/* Extra-short screens */
@media (max-height: 520px) {
  .layout { gap: 14px; }
  h1 { font-size: clamp(24px, 6vh, 40px); }
  .game { width: min(55vh, 55vw, 370px); }
  .info { margin-bottom: 5px; }
  .actions { margin-top: 5px; }
  .restart { padding: 6px 18px; }
}
@media (max-width: 760px) and (max-height: 520px) {
  .layout { gap: 3px; }
  h1 { font-size: clamp(21px, 4.5vh, 29px); }
  .game { width: min(75vw, calc(100dvh - 85px)); }
  .info { margin-bottom: 3px; }
  .actions { margin-top: 4px; }
  .restart { padding: 5px 17px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .tile, .face { transition-duration: 1ms !important; }
  .tile.spawn .face, .tile.merge .face { animation-duration: 1ms !important; }
}
</style>
</head>
<body>
<main class="layout">
  <h1><span>Dark</span><span>2048</span></h1>

  <section class="game">
    <div class="info">
      <span>Join the tiles. Reach 65536.</span>
      <div class="scores">
        <span>Score: <b class="score-value" id="score">0</b></span>
        <span>Best: <b class="score-value" id="best">0</b></span>
      </div>
    </div>

    <div class="board" id="board" aria-label="2048 game board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="actions">
      <button class="restart" id="restart">Restart</button>
    </div>
  </section>
</main>

<div class="overlay" id="winOverlay">
  <div class="dialog">
    <h2>You win!</h2>
    <p>You reached 2048! Keep playing to discover how far you can go.</p>
    <div class="dialog-buttons">
      <button class="primary" id="continueBtn">Continue</button>
      <button id="againBtn">Play again</button>
    </div>
  </div>
</div>

<div class="overlay" id="finalOverlay">
  <div class="dialog">
    <h2>Incredible!</h2>
    <p>You reached 65536. You have conquered the entire game!</p>
    <div class="dialog-buttons">
      <button class="primary" id="finalAgainBtn">Play again</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const board = document.getElementById("board");
  const cellsEl = document.getElementById("cells");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const winOverlay = document.getElementById("winOverlay");
  const finalOverlay = document.getElementById("finalOverlay");

  let grid;
  let score = 0;
  let best = loadBest();
  let nextId = 0;
  let busy = false;
  let inputQueue = [];
  let reached2048 = false;
  let finished = false;
  let tileElements = new Map();

  bestEl.textContent = best;

  function loadBest() {
    try { return Number(localStorage.getItem("dark2048-best")) || 0; }
    catch { return 0; }
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("dark2048-best", String(best)); }
      catch {}
    }
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function colorFor(value) {
    if (value < 64) {
      const colors = {
        2: ["#454548","#85858b",8,"#f7f7f8"],
        4: ["#505055","#92929a",10,"#f7f7f8"],
        8: ["#606067","#a5a5ae",13,"#f7f7f8"],
        16: ["#707078","#b8b8c0",16,"#f7f7f8"],
        32: ["#85858e","#ceced5",19,"#f7f7f8"]
      };
      return colors[value] || colors[32];
    }

    if (value < 512) {
      const level = Math.log2(value) - 6;
      const shade = Math.min(245, 188 + level * 13);
      const bg = `rgb(${shade},${shade},${Math.min(250,shade+3)})`;
      const glow = 23 + level * 12;
      return [bg, "#ffffff", glow, "#101014"];
    }

    // At 512, tiles become black and glow intensifies with every value.
    const level = Math.log2(value) - 9;
    const glow = Math.min(105, 34 + level * 12);
    const intensity = Math.min(1, .28 + level * .11);
    return [
      "#050506",
      `rgba(255,255,255,${Math.min(1,.35 + level*.1)})`,
      glow,
      "#ffffff",
      intensity
    ];
  }

  function getPosition(row, col) {
    const cell = cellsEl.children[row * SIZE + col];
    const parent = tilesEl.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();
    return {
      x: rect.left - parent.left,
      y: rect.top - parent.top,
      width: rect.width,
      height: rect.height
    };
  }

  function fontSize(value, width) {
    const digits = String(value).length;
    const ratio = digits <= 2 ? .47 : digits === 3 ? .38 :
                  digits === 4 ? .30 : digits === 5 ? .25 : .20;
    return Math.max(12, Math.min(47, width * ratio));
  }

  function updateTile(el, value, row, col) {
    const pos = getPosition(row, col);
    const [bg, border, glow, textColor, strength] = colorFor(value);

    el.style.width = pos.width + "px";
    el.style.height = pos.height + "px";
    el.style.transform = `translate3d(${pos.x}px,${pos.y}px,0)`;
    el.style.fontSize = fontSize(value, pos.width) + "px";
    el.style.setProperty("--tile-bg", bg);
    el.style.setProperty("--tile-border", border);
    el.style.setProperty("--glow", glow + "px");
    el.style.setProperty("--text-color", textColor);
    el.style.setProperty("--glow-color",
      `rgba(235,235,255,${strength ?? Math.min(.38,.08 + glow/170)})`);

    if (el.firstElementChild.textContent !== String(value)) {
      el.firstElementChild.textContent = value;
    }
  }

  function createTile(item, row, col, spawn = false) {
    const el = document.createElement("div");
    el.className = "tile" + (spawn ? " spawn" : "");
    el.dataset.id = item.id;

    const face = document.createElement("div");
    face.className = "face";
    face.textContent = item.value;
    el.appendChild(face);

    tilesEl.appendChild(el);
    tileElements.set(item.id, el);

    // Position is set immediately using the assigned cell's real coordinates.
    updateTile(el, item.value, row, col);
    return el;
  }

  function draw(keepIds = new Set()) {
    const seen = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;

        seen.add(item.id);
        let el = tileElements.get(item.id);

        if (!el) el = createTile(item, r, c);
        else updateTile(el, item.value, r, c);
      }
    }

    for (const [id, el] of tileElements) {
      if (!seen.has(id) && !keepIds.has(id)) {
        el.remove();
        tileElements.delete(id);
      }
    }
  }

  function spawnTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r,c]);
      }
    }
    if (!empty.length) return;

    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    const item = {
      id: ++nextId,
      value: Math.random() < .9 ? 2 : 4
    };

    grid[r][c] = item;
    createTile(item, r, c, true);
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    nextId = 0;
    busy = false;
    inputQueue = [];
    reached2048 = false;
    finished = false;

    for (const el of tileElements.values()) el.remove();
    tileElements.clear();

    scoreEl.textContent = "0";
    winOverlay.classList.remove("show");
    finalOverlay.classList.remove("show");

    spawnTile();
    spawnTile();
    draw();
  }

  function findTile(id, matrix = grid) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (matrix[r][c]?.id === id) return {row:r, col:c, item:matrix[r][c]};
      }
    }
    return null;
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        if (r < 3 && grid[r][c].value === grid[r+1][c].value) return true;
        if (c < 3 && grid[r][c].value === grid[r][c+1].value) return true;
      }
    }
    return false;
  }

  function requestMove(direction) {
    if (finished) return;

    // Queue quick successive swipes and key presses instead of dropping them.
    if (inputQueue.length < 12) inputQueue.push(direction);
    processQueue();
  }

  function processQueue() {
    if (busy || finished || !inputQueue.length) return;
    const direction = inputQueue.shift();
    performMove(direction);
  }

  function performMove(direction) {
    const next = emptyGrid();
    const mergePairs = [];
    let changed = false;
    let gained = 0;
    let highestCreated = 0;

    for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
      const positions = [];

      for (let k = 0; k < SIZE; k++) {
        let r, c;

        if (direction === "left") { r = lineIndex; c = k; }
        if (direction === "right") { r = lineIndex; c = SIZE - 1 - k; }
        if (direction === "up") { r = k; c = lineIndex; }
        if (direction === "down") { r = SIZE - 1 - k; c = lineIndex; }

        positions.push([r,c]);
      }

      const items = positions
        .map(([r,c]) => grid[r][c])
        .filter(Boolean);

      const compact = [];

      for (let i = 0; i < items.length; i++) {
        const first = items[i];
        const second = items[i+1];

        // Only identical values merge. A tile can merge only once per move.
        if (second && first.value === second.value) {
          const merged = {
            id: first.id,
            value: first.value * 2
          };
          compact.push(merged);
          mergePairs.push({
            winnerId: first.id,
            loserId: second.id
          });
          gained += merged.value;
          highestCreated = Math.max(highestCreated, merged.value);
          i++;
        } else {
          compact.push(first);
        }
      }

      compact.forEach((item, index) => {
        const [r,c] = positions[index];
        next[r][c] = item;

        const oldPosition = findTile(item.id, grid);
        if (!oldPosition || oldPosition.row !== r || oldPosition.col !== c) {
          changed = true;
        }
      });

      if (compact.length !== items.length) changed = true;
    }

    if (!changed) {
      processQueue();
      return;
    }

    busy = true;

    const loserIds = new Set(mergePairs.map(pair => pair.loserId));

    // Animate disappearing tiles into their actual merge destination.
    for (const pair of mergePairs) {
      const loser = tileElements.get(pair.loserId);
      const destination = findTile(pair.winnerId, next);

      if (loser && destination) {
        const pos = getPosition(destination.row, destination.col);
        loser.style.transform =
          `translate3d(${pos.x}px,${pos.y}px,0)`;
        loser.style.opacity = "0";
      }
    }

    grid = next;
    draw(loserIds);

    // Play a subtle merge flash without bouncing the tile.
    for (const pair of mergePairs) {
      const winner = tileElements.get(pair.winnerId);
      if (winner) {
        winner.classList.remove("merge");
        void winner.offsetWidth;
        winner.classList.add("merge");
      }
    }

    score += gained;
    scoreEl.textContent = score;
    saveBest();

    const reachedFinal = highestCreated >= 65536;
    const reachedTarget = highestCreated >= 2048 && !reached2048;

    setTimeout(() => {
      for (const id of loserIds) {
        const el = tileElements.get(id);
        if (el) el.remove();
        tileElements.delete(id);
      }

      if (reachedFinal) {
        finished = true;
        busy = false;
        finalOverlay.classList.add("show");
        return;
      }

      spawnTile();
      draw();
      busy = false;

      if (reachedTarget) {
        reached2048 = true;
        inputQueue = [];
        winOverlay.classList.add("show");
      } else if (!canMove()) {
        finished = true;
        inputQueue = [];
        setTimeout(() => {
          alert("Game over! Your score: " + score);
        }, 50);
      } else {
        processQueue();
      }
    }, 185);
  }

  // Keyboard controls
  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();
    const directions = {
      arrowup: "up", w: "up",
      arrowdown: "down", s: "down",
      arrowleft: "left", a: "left",
      arrowright: "right", d: "right"
    };

    if (directions[key]) {
      event.preventDefault();
      requestMove(directions[key]);
    }
  }, {passive:false});

  // Pointer controls: track the complete swipe, not just a tiny movement.
  let pointerStart = null;
  let pointerId = null;

  board.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    pointerStart = {x:event.clientX, y:event.clientY};
    pointerId = event.pointerId;
    try { board.setPointerCapture(pointerId); } catch {}
  });

  board.addEventListener("pointerup", event => {
    if (!pointerStart || event.pointerId !== pointerId) return;

    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    pointerStart = null;
    pointerId = null;

    const distance = Math.max(Math.abs(dx), Math.abs(dy));
    if (distance < 12) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      requestMove(dx > 0 ? "right" : "left");
    } else {
      requestMove(dy > 0 ? "down" : "up");
    }
  });

  board.addEventListener("pointercancel", () => {
    pointerStart = null;
    pointerId = null;
  });

  // Buttons
  document.getElementById("restart").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("finalAgainBtn").addEventListener("click", startGame);

  document.getElementById("continueBtn").addEventListener("click", () => {
    winOverlay.classList.remove("show");
    processQueue();
  });

  // Keep tile coordinates aligned when the screen changes size.
  let resizeFrame = 0;
  const resizeObserver = new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (!busy) draw();
    });
  });
  resizeObserver.observe(board);

  startGame();
})();
</script>
</body>
</html>
