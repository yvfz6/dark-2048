<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --gap: clamp(4px, 1.5vmin, 10px);
}
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #000;
}

body {
  color: #f5f5f7;
  font-family: "Google Sans", Arial, sans-serif;
  display: grid;
  place-items: center;
  padding:
    max(7px, env(safe-area-inset-top))
    max(9px, env(safe-area-inset-right))
    max(7px, env(safe-area-inset-bottom))
    max(9px, env(safe-area-inset-left));
}

.layout {
  width: min(100%, 960px);
  height: 100%;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 5vw, 65px);
}

h1 {
  flex: 0 0 auto;
  margin: 0;
  font-size: clamp(36px, 8vh, 72px);
  line-height: .91;
  letter-spacing: -.065em;
  font-weight: 700;
}
h1 span { display: block; }

.game {
  width: min(460px, 58vh, 48vw);
  min-width: 0;
  flex: 0 1 auto;
}

.info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 9px;
  color: #96969d;
  font-size: clamp(10px, 1.6vmin, 13px);
}
.score { white-space: nowrap; color: #eee; }
.score strong { color: white; }

.board {
  width: 100%;
  aspect-ratio: 1;
  position: relative;
  padding: 2.6%;
  overflow: hidden;
  border: 1px solid rgba(230,230,240,.2);
  border-radius: clamp(12px, 2.5vmin, 19px);
  background: linear-gradient(145deg,#202023,#111113);
  box-shadow: 0 18px 60px #000b, inset 0 1px 0 #ffffff0d;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.cells, .tiles {
  position: absolute;
  inset: 2.6%;
}
.cells {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  grid-template-rows: repeat(4,1fr);
  gap: var(--gap);
}
.cell {
  min-width: 0;
  min-height: 0;
  border-radius: clamp(5px,1.4vmin,10px);
  border: 1px solid rgba(215,215,225,.3);
  background: linear-gradient(145deg,#29292d,#202023);
  box-shadow: inset 0 1px 2px #ffffff08;
}
.tiles { pointer-events: none; }

.tile {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(5px,1.4vmin,10px);
  will-change: transform, opacity;
  transition:
    transform 175ms cubic-bezier(.22,.72,.22,1),
    opacity 150ms ease;
  font-weight: 700;
  letter-spacing: -1.5px;
}
.face {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: var(--tile-bg);
  color: var(--tile-text);
  border: 1px solid var(--tile-border);
  box-shadow:
    0 0 var(--glow) var(--glow-color),
    inset 0 1px 0 var(--shine);
  text-shadow: 0 1px 8px var(--text-glow);
  transition: background 160ms, color 160ms, box-shadow 160ms;
}
.tile.spawn .face {
  animation: appear 170ms cubic-bezier(.16,.8,.3,1) both;
}
.tile.merged .face {
  animation: mergeFlash 180ms ease-out;
}
@keyframes appear {
  from { transform: scale(.35); opacity: .15; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes mergeFlash {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.45); }
  100% { filter: brightness(1); }
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: clamp(7px,1.5vmin,14px);
}
.restart {
  padding: 9px 28px;
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(#080808,#080808) padding-box,
    linear-gradient(120deg,#777,#dedee2,#666) border-box;
  color: #eee;
  font: 600 14px "Google Sans",sans-serif;
  cursor: pointer;
}
.restart:active { transform: scale(.97); }
.restart:hover {
  background:
    linear-gradient(#191919,#191919) padding-box,
    linear-gradient(120deg,#aaa,#fff,#888) border-box;
}

.overlay {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.overlay.show { display: flex; }
.dialog {
  width: min(390px, 100%);
  padding: clamp(25px,5vw,38px);
  text-align: center;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 22px;
  background: linear-gradient(145deg,#242427,#101012);
  box-shadow: 0 20px 80px #000b, inset 0 1px 0 #ffffff12;
  animation: dialogIn .25s ease-out both;
}
@keyframes dialogIn {
  from { opacity: 0; transform: scale(.94) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.dialog h2 {
  margin: 0 0 10px;
  font-size: clamp(30px,7vw,42px);
  letter-spacing: -1.5px;
}
.dialog p { color: #aaaab2; margin: 0 0 22px; }
.dialog-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.dialog button {
  min-width: 125px;
  padding: 11px 17px;
  border: 1px solid #777;
  border-radius: 10px;
  color: white;
  background: #29292d;
  font: 600 14px "Google Sans",sans-serif;
  cursor: pointer;
}
.dialog button.primary {
  color: #080808;
  background: #eee;
  border-color: #eee;
}
.dialog button:active { transform: scale(.97); }

/* Portrait phones and portrait tablets */
@media (max-width: 760px) {
  .layout {
    flex-direction: column;
    gap: clamp(5px,1.3vh,13px);
  }
  h1 {
    font-size: clamp(25px,5.3vh,43px);
    line-height: .9;
    letter-spacing: -.055em;
    text-align: center;
  }
  h1 span { display: inline; }
  h1 span + span::before { content: " "; }
  .game {
    width: min(90vw, 460px, calc(100dvh - 145px));
    flex: 0 1 auto;
  }
  .info { margin-bottom: 6px; }
  .controls { margin-top: 7px; }
  .restart { padding: 8px 24px; }
}

/* Landscape phones and short screens */
@media (max-height: 560px) {
  .layout { gap: 18px; }
  h1 { font-size: clamp(24px,7vh,42px); }
  .game { width: min(68vh, 48vw, 390px); }
  .info { margin-bottom: 4px; }
  .controls { margin-top: 5px; }
  .restart { padding: 6px 20px; }
}
@media (max-width: 760px) and (max-height: 560px) {
  .layout { flex-direction: row; gap: 12px; }
  h1 {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: clamp(20px,5vh,30px);
    letter-spacing: -.04em;
  }
  h1 span { display: block; }
  h1 span + span::before { content: none; }
  .game { width: min(76vh, 68vw, 390px); }
}

@media (prefers-reduced-motion: reduce) {
  .tile { transition-duration: 1ms; }
  .tile .face { animation-duration: 1ms !important; }
}
</style>
</head>

<body>
<main class="layout">
  <h1><span>Dark</span><span>2048</span></h1>

  <section class="game">
    <div class="info">
      <span>Join the tiles. Reach 2048.</span>
      <span class="score">
        Score: <strong id="score">0</strong>
        &nbsp;·&nbsp; Best: <strong id="best">0</strong>
      </span>
    </div>

    <div class="board" id="board" aria-label="2048 game board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="controls">
      <button class="restart" id="restart">Restart</button>
    </div>
  </section>
</main>

<div class="overlay" id="winOverlay">
  <div class="dialog">
    <h2>You win!</h2>
    <p>You reached 2048! Keep going or start a new game.</p>
    <div class="dialog-buttons">
      <button class="primary" id="continueBtn">Continue</button>
      <button id="playAgainBtn">Play again</button>
    </div>
  </div>
</div>

<div class="overlay" id="finalOverlay">
  <div class="dialog">
    <h2>Incredible!</h2>
    <p>You reached 65536 and completed the whole game!</p>
    <div class="dialog-buttons">
      <button class="primary" id="finalRestartBtn">Play again</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const SIZE = 4;
  const MOVE_MS = 180;

  const board = document.getElementById("board");
  const cellsEl = document.getElementById("cells");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const winOverlay = document.getElementById("winOverlay");
  const finalOverlay = document.getElementById("finalOverlay");

  let grid, score = 0, best = 0, nextId = 0;
  let tileElements = new Map();
  let busy = false;
  let inputQueue = [];
  let winShown = false;
  let gameFinished = false;

  try {
    best = Number(localStorage.getItem("dark2048-highscore")) || 0;
  } catch (e) {}
  bestEl.textContent = best;

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  function tileStyle(value) {
    if (value < 64) {
      const colors = {
        2: ["#454548","#f5f5f6",8],
        4: ["#55555a","#f5f5f6",10],
        8: ["#68686e","#fff",12],
        16: ["#77777f","#fff",15],
        32: ["#898992","#fff",18]
      };
      const [bg, text, glow] = colors[value] || colors[32];
      return {bg, text, glow};
    }

    if (value === 64) {
      return {bg:"#c9c9ce", text:"#080808", glow:13};
    }
    if (value === 128) {
      return {bg:"#d8d8dd", text:"#080808", glow:22};
    }
    if (value === 256) {
      return {bg:"#eeeeF1", text:"#080808", glow:34};
    }

    // From 512 onward: black tiles with increasingly intense glow.
    const level = Math.max(0, Math.log2(value) - 9);
    const glow = Math.min(75, 25 + level * 9);
    const alpha = Math.min(.95, .24 + level * .11);

    return {
      bg: "#050506",
      text: "#fff",
      glow,
      glowColor: `rgba(245,245,255,${alpha})`
    };
  }

  function getPosition(row, col) {
    const cell = cellsEl.children[row * SIZE + col];
    const parent = tilesEl.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();

    return {
      x: rect.left - parent.left,
      y: rect.top - parent.top,
      width: rect.width,
      height: rect.height
    };
  }

  function fontSize(value, width) {
    const digits = String(value).length;
    const ratio =
      digits <= 1 ? .53 :
      digits === 2 ? .47 :
      digits === 3 ? .39 :
      digits === 4 ? .32 : .25;

    return Math.max(12, Math.min(48, width * ratio));
  }

  function setTilePosition(el, row, col, instant = false) {
    const p = getPosition(row, col);
    if (instant) el.style.transition = "none";

    el.style.width = p.width + "px";
    el.style.height = p.height + "px";
    el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;

    if (instant) {
      el.offsetHeight;
      el.style.removeProperty("transition");
    }
  }

  function applyTileAppearance(el, value, row, col) {
    const p = getPosition(row, col);
    const style = tileStyle(value);
    const face = el.firstElementChild;

    setTilePosition(el, row, col);
    el.style.fontSize = fontSize(value, p.width) + "px";

    face.textContent = value;
    face.style.setProperty("--tile-bg", style.bg);
    face.style.setProperty("--tile-text", style.text);
    face.style.setProperty("--tile-border",
      value >= 512 ? "rgba(255,255,255,.65)" : "rgba(255,255,255,.28)");
    face.style.setProperty("--glow", style.glow + "px");
    face.style.setProperty("--glow-color",
      style.glowColor || `rgba(235,235,255,${Math.min(.4,.08 + style.glow/100)})`);
    face.style.setProperty("--shine",
      value >= 512 ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.12)");
    face.style.setProperty("--text-glow",
      value >= 512 ? "rgba(255,255,255,.4)" : "rgba(255,255,255,.1)");
  }

  function createTile(item, row, col, spawn = false) {
    const el = document.createElement("div");
    el.className = "tile" + (spawn ? " spawn" : "");
    el.dataset.id = item.id;

    const face = document.createElement("div");
    face.className = "face";
    el.appendChild(face);

    // Position it in its actual cell before its first paint.
    el.style.transition = "none";
    tilesEl.appendChild(el);
    tileElements.set(item.id, el);
    applyTileAppearance(el, item.value, row, col);
    el.offsetHeight;
    el.style.removeProperty("transition");

    return el;
  }

  function drawAll(instant = false) {
    const seen = new Set();

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;

        seen.add(item.id);
        let el = tileElements.get(item.id);

        if (!el) {
          createTile(item, r, c);
        } else {
          if (instant) setTilePosition(el, r, c, true);
          else applyTileAppearance(el, item.value, r, c);
        }
      }
    }

    for (const [id, el] of tileElements) {
      if (!seen.has(id)) {
        el.remove();
        tileElements.delete(id);
      }
    }
  }

  function spawnTile() {
    const empty = [];

    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!grid[r][c]) empty.push([r,c]);

    if (!empty.length) return;

    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    const item = {
      id: ++nextId,
      value: Math.random() < .9 ? 2 : 4
    };

    grid[r][c] = item;
    createTile(item, r, c, true);
  }

  function updateScore(gained) {
    score += gained;
    scoreEl.textContent = score;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem("dark2048-highscore", String(best));
      } catch (e) {}
    }
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    nextId = 0;
    busy = false;
    inputQueue = [];
    winShown = false;
    gameFinished = false;

    winOverlay.classList.remove("show");
    finalOverlay.classList.remove("show");

    for (const el of tileElements.values()) el.remove();
    tileElements.clear();

    scoreEl.textContent = "0";
    spawnTile();
    spawnTile();
  }

  function findTile(id, boardState = grid) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (boardState[r][c]?.id === id) return {row:r,col:c};
      }
    }
    return null;
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        if (r < 3 && grid[r][c].value === grid[r+1][c]?.value) return true;
        if (c < 3 && grid[r][c].value === grid[r][c+1]?.value) return true;
      }
    }
    return false;
  }

  function checkMilestones() {
    const highest = Math.max(...grid.flat().filter(Boolean).map(t => t.value));

    if (highest >= 65536) {
      gameFinished = true;
      finalOverlay.classList.add("show");
      return;
    }

    if (highest >= 2048 && !winShown) {
      winShown = true;
      winOverlay.classList.add("show");
    }

    if (!hasMoves()) {
      setTimeout(() => {
        if (!gameFinished && !winOverlay.classList.contains("show")) {
          alert("Game over! Your score: " + score);
        }
      }, 80);
    }
  }

  function requestMove(direction) {
    if (gameFinished) return;
    if (inputQueue.length < 30) inputQueue.push(direction);
    processQueue();
  }

  function processQueue() {
    if (busy || !inputQueue.length || gameFinished) return;

    const direction = inputQueue.shift();
    performMove(direction);
  }

  function performMove(direction) {
    const next = emptyGrid();
    const mergePairs = [];
    const newValues = new Map();
    let changed = false;
    let gained = 0;

    for (let lineIndex = 0; lineIndex < SIZE; lineIndex++) {
      const line = [];

      for (let k = 0; k < SIZE; k++) {
        let r, c;

        if (direction === "left" || direction === "right") {
          r = lineIndex;
          c = direction === "left" ? k : SIZE - 1 - k;
        } else {
          r = direction === "up" ? k : SIZE - 1 - k;
          c = lineIndex;
        }

        if (grid[r][c]) line.push(grid[r][c]);
      }

      const result = [];

      for (let i = 0; i < line.length; i++) {
        const current = line[i];
        const following = line[i+1];

        if (following && current.value === following.value) {
          const newValue = current.value * 2;
          result.push(current);
          newValues.set(current.id, newValue);
          mergePairs.push({
            winner: current.id,
            loser: following.id,
            value: newValue
          });
          gained += newValue;
          i++;
        } else {
          result.push(current);
        }
      }

      for (let k = 0; k < result.length; k++) {
        let r, c;

        if (direction === "left" || direction === "right") {
          r = lineIndex;
          c = direction === "left" ? k : SIZE - 1 - k;
        } else {
          r = direction === "up" ? k : SIZE - 1 - k;
          c = lineIndex;
        }

        next[r][c] = result[k];

        const oldPosition = findTile(result[k].id, grid);
        if (!oldPosition || oldPosition.row !== r || oldPosition.col !== c) {
          changed = true;
        }
      }

      if (result.length !== line.length) changed = true;
    }

    if (!changed) {
      processQueue();
      return;
    }

    busy = true;

    // Keep the losing tile alive so it can glide into its matching tile.
    for (const pair of mergePairs) {
      const loserEl = tileElements.get(pair.loser);
      const destination = findTile(pair.winner, next);
      if (!loserEl || !destination) continue;

      const p = getPosition(destination.row, destination.col);
      loserEl.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
      loserEl.style.opacity = "0";
    }

    // Move all surviving tiles to their new cells.
    grid = next;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;
        const el = tileElements.get(item.id);
        if (el) setTilePosition(el, r, c);
      }
    }

    updateScore(gained);

    // Finish the movement before applying the merged tile's new value.
    setTimeout(() => {
      for (const pair of mergePairs) {
        const loser = tileElements.get(pair.loser);
        if (loser) loser.remove();
        tileElements.delete(pair.loser);

        const winner = tileElements.get(pair.winner);
        const position = findTile(pair.winner);
        if (winner && position) {
          winner.classList.remove("merged");
          void winner.offsetWidth;
          applyTileAppearance(winner, pair.value, position.row, position.col);
          winner.classList.add("merged");
        }
      }

      // Update any tiles that did not merge.
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const item = grid[r][c];
          if (!item || newValues.has(item.id)) continue;
          const el = tileElements.get(item.id);
          if (el) setTilePosition(el, r, c);
        }
      }

      spawnTile();
      busy = false;
      checkMilestones();
      processQueue();
    }, MOVE_MS + 10);
  }

  // Keyboard controls
  document.addEventListener("keydown", e => {
    const keyMap = {
      ArrowUp:"up", w:"up", W:"up",
      ArrowDown:"down", s:"down", S:"down",
      ArrowLeft:"left", a:"left", A:"left",
      ArrowRight:"right", d:"right", D:"right"
    };

    const direction = keyMap[e.key];
    if (direction) {
      e.preventDefault();
      requestMove(direction);
    }
  }, {passive:false});

  // Reliable pointer swipe controls.
  let pointerStart = null;

  board.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointerStart = {x:e.clientX, y:e.clientY, id:e.pointerId};
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });

  board.addEventListener("pointerup", e => {
    if (!pointerStart || pointerStart.id !== e.pointerId) return;

    const dx = e.clientX - pointerStart.x;
    const dy = e.clientY - pointerStart.y;
    pointerStart = null;

    const distance = Math.max(Math.abs(dx), Math.abs(dy));
    if (distance < 10) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      requestMove(dx > 0 ? "right" : "left");
    } else {
      requestMove(dy > 0 ? "down" : "up");
    }
  });

  board.addEventListener("pointercancel", () => {
    pointerStart = null;
  });

  // Resize without leaving tiles behind in their previous positions.
  let resizeFrame = 0;
  function repositionTiles() {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (!grid || busy) return;
      drawAll(true);
    });
  }

  window.addEventListener("resize", repositionTiles);
  if ("ResizeObserver" in window) {
    new ResizeObserver(repositionTiles).observe(board);
  }

  document.getElementById("restart").addEventListener("click", startGame);
  document.getElementById("continueBtn").addEventListener("click", () => {
    winOverlay.classList.remove("show");
  });
  document.getElementById("playAgainBtn").addEventListener("click", startGame);
  document.getElementById("finalRestartBtn").addEventListener("click", startGame);

  startGame();
})();
</script>
</body>
</html>
