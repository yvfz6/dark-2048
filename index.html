<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

:root {
  --gap: clamp(4px, 1.5vmin, 10px);
  --board-size:  min(80vw, 60vh);
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  background: #000;
}

body {
  color: #f5f5f5;
  font-family: "Google Sans", Arial, sans-serif;
  display: grid;
  place-items: center;
  padding:
    max(7px, env(safe-area-inset-top))
    max(9px, env(safe-area-inset-right))
    max(7px, env(safe-area-inset-bottom))
    max(9px, env(safe-area-inset-left));
}

.layout {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 5vw, 65px);
  min-height: 0;
}

h1 {
  flex: 0 0 auto;
  margin: 0;
  font-size: clamp(38px, 7vw, 68px);
  line-height: .95;
  letter-spacing: -.06em;
  font-weight: 700;
}
h1 span { display: block; }

.game {
  width: var(--board-size);
  max-width: 100%;
  flex: 0 1 auto;
  min-width: 0;
}

.info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 2px 9px;
  color: #99999f;
  font-size: clamp(10px, 1.7vmin, 13px);
  white-space: nowrap;
}

.scores {
  display: flex;
  gap: 12px;
  color: #eee;
  font-weight: 600;
}

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  padding: 2.6%;
  border-radius: clamp(11px, 2.8vmin, 18px);
  background: linear-gradient(145deg, #202023, #111113);
  border: 1px solid rgba(255,255,255,.17);
  box-shadow: 0 18px 55px rgba(0,0,0,.55),
              inset 0 1px 0 rgba(255,255,255,.06);
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

.cells, .tiles {
  position: absolute;
  inset: 2.6%;
}

.cells {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: var(--gap);
}

.cell {
  background: linear-gradient(145deg, #29292c, #222225);
  border: 1px solid rgba(220,220,230,.30);
  border-radius: clamp(5px, 1.4vmin, 10px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.035);
}

.tiles { pointer-events: none; }

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: clamp(5px, 1.4vmin, 10px);
  will-change: transform, opacity;
  transition:
    transform 235ms cubic-bezier(.35,.05,.25,1),
    opacity 180ms ease;
  font-weight: 700;
  letter-spacing: -1.5px;
  color: #f8f8fa;
  text-shadow: 0 1px 7px rgba(255,255,255,.12);
}

.tile .face {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: inherit;
  background: var(--tile-bg);
  border: 1px solid var(--tile-border);
  box-shadow:
    0 0 var(--glow) var(--glow-color),
    inset 0 1px 0 rgba(255,255,255,.12);
}

.tile.dark-text {
  color: #171719;
  text-shadow: none;
}

.tile.spawn .face {
  animation: spawn .2s ease-out both;
}

.tile.merged .face {
  animation: merge .22s ease-out both;
}

@keyframes spawn {
  from { transform: scale(.45); opacity: .2; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes merge {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.35); }
  100% { filter: brightness(1); }
}

.buttons {
  display: flex;
  justify-content: center;
  margin-top: clamp(8px, 1.8vmin, 17px);
}

.restart, .modal-btn {
  padding: clamp(7px, 1.5vmin, 11px) clamp(20px, 4vw, 30px);
  border: 1px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(#080808,#080808) padding-box,
    linear-gradient(120deg,#777,#dedee2,#666) border-box;
  color: #eee;
  font: 600 clamp(12px, 1.8vmin, 15px) "Google Sans", sans-serif;
  cursor: pointer;
  transition: transform .15s, background .2s;
}

.restart:hover, .modal-btn:hover {
  background:
    linear-gradient(#191919,#191919) padding-box,
    linear-gradient(120deg,#aaa,#fff,#888) border-box;
}
.restart:active, .modal-btn:active { transform: scale(.97); }

/* Victory overlay */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility .25s;
}
.overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal {
  width: min(360px, 100%);
  padding: 32px 24px;
  text-align: center;
  background: linear-gradient(145deg,#202023,#101012);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 20px;
  box-shadow: 0 20px 70px rgba(0,0,0,.6);
  transform: translateY(12px) scale(.97);
  transition: transform .25s ease;
}
.overlay.show .modal {
  transform: translateY(0) scale(1);
}
.modal h2 {
  font-size: clamp(36px, 9vw, 48px);
  letter-spacing: -2px;
  margin: 0 0 8px;
}
.modal p {
  color: #aaaab0;
  font-size: 14px;
  margin: 0 0 23px;
}
.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-btn {
  width: 100%;
  padding: 12px 18px;
  font-size: 14px;
}
.modal-btn.primary {
  background:
    linear-gradient(#eee,#eee) padding-box,
    linear-gradient(120deg,#fff,#999) border-box;
  color: #111;
}
.modal-btn.primary:hover {
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(120deg,#fff,#bbb) border-box;
}

/* Phones and portrait tablets */
@media (max-width: 700px) {
  .layout {
    flex-direction: column;
    gap: clamp(5px, 1.5vh, 14px);
  }

  h1 {
    font-size: clamp(25px, 6vh, 39px);
    line-height: .95;
    letter-spacing: -.05em;
    text-align: center;
  }

  h1 span { display: inline; }
  h1 span + span::before { content: " "; }

  .game {
    width: var(--board-size);
    flex: 0 1 auto;
  }

  .info { margin-bottom: 7px; }
  .buttons { margin-top: 8px; }
}

/* Short landscape screens */
@media (max-height: 520px) {
  .layout { gap: 18px; }
  h1 { font-size: clamp(23px, 6vh, 38px); }
  .info { margin-bottom: 5px; }
  .buttons { margin-top: 6px; }
  .restart { padding: 6px 18px; }
}

@media (max-width: 700px) and (max-height: 520px) {
  .layout { gap: 4px; }
  h1 { font-size: clamp(20px, 5vh, 28px); }
}

@media (prefers-reduced-motion: reduce) {
  .tile, .overlay, .modal { transition-duration: 1ms; }
  .tile .face { animation-duration: 1ms !important; }
}
</style>
</head>
<body>

<main class="layout">
  <h1><span>Dark</span><span>2048</span></h1>

  <section class="game">
    <div class="info">
      <span>Join the tiles. Reach 2048.</span>
      <div class="scores">
        <span>Score: <b id="score">0</b></span>
        <span>Best: <b id="best">0</b></span>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="buttons">
      <button class="restart" id="restart">Restart</button>
    </div>
  </section>
</main>

<div class="overlay" id="winOverlay">
  <div class="modal">
    <h2>You win!</h2>
    <p>You reached 2048! What would you like to do?</p>
    <div class="modal-actions">
      <button class="modal-btn primary" id="continueBtn">Continue</button>
      <button class="modal-btn" id="playAgainBtn">Play Again</button>
    </div>
  </div>
</div>

<script>
(() => {
  const SIZE = 4;
  const board = document.getElementById("board");
  const cellsEl = document.getElementById("cells");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("winOverlay");

  let grid, score = 0, best = 0;
  let busy = false;
  let tileId = 0;
  let won = false;
  const tileElements = new Map();

  try {
    best = Number(localStorage.getItem("dark2048-best")) || 0;
  } catch (_) {}
  bestEl.textContent = best;

  // Calculate the board from the actual available viewport.
  function fitLayout() {
    const width = window.innerWidth;
    const height = window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

    const mobile = width <= 700;
    let size;

    if (mobile) {
      const titleHeight = Math.min(45, Math.max(25, height * .065));
      const infoHeight = 25;
      const buttonHeight = 42;
      const spacing = 37;
      const safeSpace = 24;
      const availableHeight = height - titleHeight - infoHeight -
                              buttonHeight - spacing - safeSpace;
      size = Math.min(width - 24, availableHeight, 460);
    } else {
      size = Math.min(width * .52, height * .78, 460);
    }

    size = Math.max(150, size);
    document.documentElement.style.setProperty("--board-size", size + "px");

    if (grid && !busy) draw();
  }

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cellsEl.appendChild(cell);
  }

  function emptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  function colorFor(value) {
    const styles = {
      2:    ["#454548","#77777d",8,false],
      4:    ["#55555a","#85858c",10,false],
      8:    ["#68686e","#a0a0a8",13,false],
      16:   ["#77777f","#b1b1ba",16,false],
      32:   ["#898992","#c4c4cd",20,false],
      64:   ["#9b9ba5","#d0d0d9",24,false],
      128:  ["#b0b0ba","#dedee6",29,false],
      256:  ["#c0c0ca","#e9e9ef",34,false],
      512:  ["#d0d0d8","#f1f1f5",39,true],
      1024: ["#dedee5","#fafaff",45,true],
      2048: ["#ededf2","#fff",52,true]
    };
    return styles[value] || ["#ededf2","#fff",58,true];
  }

  function getPosition(row, col) {
    const cell = cellsEl.children[row * SIZE + col];
    const parent = tilesEl.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();
    return {
      x: rect.left - parent.left,
      y: rect.top - parent.top,
      width: rect.width,
      height: rect.height
    };
  }

  function fontSize(value, width) {
    const digits = String(value).length;
    const ratio = digits === 1 ? .53 :
                  digits === 2 ? .47 :
                  digits === 3 ? .39 :
                  digits === 4 ? .32 : .25;
    return Math.max(12, Math.min(48, width * ratio));
  }

  function updateTile(el, value, row, col) {
    const p = getPosition(row, col);
    const [bg, border, glow, darkText] = colorFor(value);

    el.style.width = p.width + "px";
    el.style.height = p.height + "px";
    el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
    el.style.fontSize = fontSize(value, p.width) + "px";
    el.style.setProperty("--tile-bg", bg);
    el.style.setProperty("--tile-border", border);
    el.style.setProperty("--glow", glow + "px");
    el.style.setProperty("--glow-color",
      `rgba(235,235,255,${Math.min(.32,.09 + glow / 220)})`);

    el.classList.toggle("dark-text", darkText);
    el.firstChild.textContent = value;
  }

  function createTile(item, row, col, spawn = false) {
    const el = document.createElement("div");
    el.className = "tile" + (spawn ? " spawn" : "");
    el.dataset.id = item.id;

    const face = document.createElement("div");
    face.className = "face";
    el.appendChild(face);
    tilesEl.appendChild(el);
    tileElements.set(item.id, el);

    updateTile(el, item.value, row, col);
    return el;
  }

  function draw() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const item = grid[r][c];
        if (!item) continue;

        let el = tileElements.get(item.id);
        if (!el) {
          el = createTile(item, r, c);
        } else {
          updateTile(el, item.value, r, c);
        }
      }
    }
  }

  function spawnTile() {
    const empty = [];

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) empty.push([r,c]);
      }
    }

    if (!empty.length) return;

    const [r,c] = empty[Math.floor(Math.random() * empty.length)];
    const item = {
      id: ++tileId,
      value: Math.random() < .9 ? 2 : 4
    };

    grid[r][c] = item;
    createTile(item, r, c, true);
  }

  function updateScore() {
    scoreEl.textContent = score;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem("dark2048-best", String(best));
      } catch (_) {}
    }
  }

  function startGame() {
    grid = emptyGrid();
    score = 0;
    busy = false;
    won = false;
    tileId = 0;
    overlay.classList.remove("show");

    tileElements.forEach(el => el.remove());
    tileElements.clear();

    updateScore();
    spawnTile();
    spawnTile();
    draw();
    fitLayout();
  }

  function checkWin() {
    if (won) return;

    const reached = grid.some(row =>
      row.some(item => item && item.value >= 2048)
    );

    if (reached) {
      won = true;
      setTimeout(() => overlay.classList.add("show"), 260);
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;

        if (r < 3 && grid[r][c].value === grid[r+1][c].value)
          return true;

        if (c < 3 && grid[r][c].value === grid[r][c+1].value)
          return true;
      }
    }
    return false;
  }

  function move(direction) {
    if (busy || overlay.classList.contains("show")) return;

    const next = emptyGrid();
    let changed = false;
    let gained = 0;
    const mergePairs = [];

    for (let i = 0; i < SIZE; i++) {
      const line = [];

      for (let j = 0; j < SIZE; j++) {
        const r = direction === "up" ? j :
                  direction === "down" ? 3-j : i;
        const c = direction === "left" ? j :
                  direction === "right" ? 3-j : i;

        if (grid[r][c]) line.push(grid[r][c]);
      }

      const compact = [];

      for (let j = 0; j < line.length; j++) {
        if (j + 1 < line.length &&
            line[j].value === line[j+1].value) {
          const winner = line[j];
          const loser = line[j+1];

          compact.push({
            id: winner.id,
            value: winner.value * 2
          });

          mergePairs.push({
            winner: winner.id,
            loser: loser.id
          });

          gained += winner.value * 2;
          j++;
        } else {
          compact.push(line[j]);
        }
      }

      for (let j = 0; j < compact.length; j++) {
        const r = direction === "up" ? j :
                  direction === "down" ? 3-j : i;
        const c = direction === "left" ? j :
                  direction === "right" ? 3-j : i;

        next[r][c] = compact[j];

        if (grid[r][c] !== compact[j]) changed = true;
      }

      if (compact.length !== line.length) changed = true;
    }

    if (!changed) return;

    busy = true;

    // Move disappearing merge tiles toward their matching destination.
    for (const pair of mergePairs) {
      const loser = tileElements.get(pair.loser);
      if (!loser) continue;

      const row = next.findIndex(line =>
        line.some(item => item && item.id === pair.winner)
      );
      const col = next[row].findIndex(item =>
        item && item.id === pair.winner
      );

      const p = getPosition(row, col);
      loser.style.transform =
        `translate3d(${p.x}px,${p.y}px,0)`;
      loser.style.opacity = "0";
    }

    grid = next;

    for (const pair of mergePairs) {
      const row = grid.findIndex(line =>
        line.some(item => item && item.id === pair.winner)
      );
      const col = grid[row].findIndex(item =>
        item && item.id === pair.winner
      );
      const item = grid[row][col];
      const el = tileElements.get(pair.winner);

      if (el) {
        updateTile(el, item.value, row, col);
        el.classList.remove("merged");
        void el.offsetWidth;
        el.classList.add("merged");
      }
    }

    draw();
    score += gained;
    updateScore();

    setTimeout(() => {
      for (const pair of mergePairs) {
        const el = tileElements.get(pair.loser);
        if (el) el.remove();
        tileElements.delete(pair.loser);
      }

      spawnTile();
      draw();
      busy = false;

      checkWin();

      if (!canMove()) {
        setTimeout(() => {
          if (!overlay.classList.contains("show")) {
            alert("Game over! Your score: " + score);
          }
        }, 100);
      }
    }, 245);
  }

  document.addEventListener("keydown", e => {
    const keys = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };

    if (keys[e.key]) {
      e.preventDefault();
      move(keys[e.key]);
    }
  });

  let startX = 0, startY = 0;

  board.addEventListener("pointerdown", e => {
    startX = e.clientX;
    startY = e.clientY;
    board.setPointerCapture(e.pointerId);
  });

  board.addEventListener("pointerup", e => {
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }
  });

  document.getElementById("restart").addEventListener("click", startGame);

  document.getElementById("continueBtn").addEventListener("click", () => {
    overlay.classList.remove("show");
    // The game continues beyond 2048.
  });

  document.getElementById("playAgainBtn").addEventListener("click", startGame);

  window.addEventListener("resize", fitLayout);
  window.addEventListener("orientationchange", () => {
    setTimeout(fitLayout, 100);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fitLayout);
  }

  if ("ResizeObserver" in window) {
    new ResizeObserver(() => {
      if (grid && !busy) draw();
    }).observe(board);
  }

  fitLayout();
  startGame();
})();
</script>
</body>
</html>
